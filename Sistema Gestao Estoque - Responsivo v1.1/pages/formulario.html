		<!-- Conteúdo principal -->
		<main>
			<div id="mensagem" class="mensagem"></div>
			<section class="container">
				<h2>Adicionar novo produto</h2>
				<!--Esse é o formulário para adicionar produto-->
				<form class="formulario" id="formulario">
					<div class="campo">
						<label for="nome" id="label"><b>Nome do Produto</b></label>
						<input type="text" id="nome" placeholder="Digite o novo Produto" />
					</div>

					<div class="campo">
						<label for="preco" id="label"><b>Preço </b></label>
						<input
							type="number"
							id="preco"
							placeholder="Digite o preço do produto"
							required
						/>
					</div>

					<div class="campo">
						<label for="quantidade" id="label"><b>Quantidade</b></label>
						<input
							type="number"
							id="quantidade"
							placeholder="Digite a quantidade"
							required
						/>
					</div>

					<div class="section-btn" id="btn-form">
						<button id="add-btn" type="submit"><b>Adicionar</b></button>
						<button id="cancelar-btn" type="button" onclick="cancelar()">
							<b>Cancelar</b>
						</button>
					</div>
				</form>
			</section>
		</main>
