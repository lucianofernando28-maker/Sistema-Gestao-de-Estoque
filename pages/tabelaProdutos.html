		<title>Produtos em estoque</title>
		<link rel="stylesheet" href="../css/tabela-styles.css" />

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>
	</head>
	<body>
		<!-- Barra de navegação -->
		<nav class="navbar">
			<div class="logo">
				<img class="logo" src="../img/logo-ml.png" alt="Logo da ML" />
			</div>
			<div class="menu-toggle" id="menu-toggle">☰</div>
			<ul class="nav-links" id="nav-links">

					<a href="../index.html"><b>Início</b></a>

		<h2 id="titulo">Produtos em estoque</h2>

			<section id="container">
				<table>
					<thead>
						<tr>
							<th>PRODUTO</th>
							<th>PREÇO</th>
							<th>QTD</th>
							<th>VALOR TOTAL</th>
							<th>ACÇÃO</th>
						</tr>
					</thead>
					<tbody style="max-height: 5px" id="tabelaProdutos"></tbody>
				</table>
				<br />
				<div id="paginacao"></div>
			</section>

			<!--Secção botões-->

			<section id="section-btn">
				<button id="btn-novo" onclick="novo()">
					<b>Novo</b>
				</button>

				<button id="btn-voltar" onclick="voltar()">
